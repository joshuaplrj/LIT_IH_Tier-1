version: "3.9"

services:
  # --- Time-Series Database ---
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_USER: smartcity
      POSTGRES_PASSWORD: smartcity
      POSTGRES_DB: digital_twin
    ports:
      - "5432:5432"
    volumes:
      - tsdb_data:/var/lib/postgresql/data

  # --- Backend API + Ingestor ---
  backend:
    build: ./app/backend
    depends_on:
      - timescaledb
    environment:
      DATABASE_URL: postgresql://smartcity:smartcity@timescaledb:5432/digital_twin
    ports:
      - "8000:8000"

  # --- Frontend (3D Visualization) ---
  frontend:
    build: ./app/frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"

  # --- Reverse Proxy ---
  nginx:
    image: nginx:alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./app/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  tsdb_data:
